<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入學管道選擇器</title>
    <style>
        body {
            font-family: '微軟正黑體', sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        /* 控制面板區域 */
        .controls {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .toggle-label {
            display: inline-block;
            margin: 0 15px 10px 0;
            cursor: pointer;
            font-size: 16px;
        }

        /* 卡片網格佈局 */
        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        /* 單一卡片樣式 */
        .channel-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid #3b82f6; /* 預設藍色邊框 */
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            /* 加入轉場動畫，讓灰階切換更平滑 */
            transition: all 0.4s ease; 
        }

        /* 核心邏輯：沒選到的狀態 (灰階 + 半透明) */
        .channel-card.inactive {
            filter: grayscale(100%);
            opacity: 0.4;
            border-left-color: #999;
        }

        h3 { margin-top: 0; color: #333; }
        p { color: #666; font-size: 14px; margin-bottom: 0; }
    </style>
</head>
<body>

    <h2>請勾選你想參加的入學管道：</h2>
    
    <div class="controls">
        <label class="toggle-label">
            <input type="checkbox" class="channel-toggle" value="card-main" checked> 分區免試 (大免)
        </label>
        <label class="toggle-label">
            <input type="checkbox" class="channel-toggle" value="card-prior" checked> 優先免試 (優免)
        </label>
        <label class="toggle-label">
            <input type="checkbox" class="channel-toggle" value="card-five" checked> 五專聯合免試
        </label>
        <label class="toggle-label">
            <input type="checkbox" class="channel-toggle" value="card-art" checked> 藝才班/體育班
        </label>
    </div>

    <div class="card-container">
        <div id="card-main" class="channel-card">
            <h3>分區免試 (大免)</h3>
            <p>全國最主要的升學管道，看會考成績與志願序。約九成學生參加。</p>
        </div>
        
        <div id="card-prior" class="channel-card">
            <h3>優先免試 (優免)</h3>
            <p>鼓勵就近入學，大免放榜前就會先進行。有區域與名額限制。</p>
        </div>
        
        <div id="card-five" class="channel-card">
            <h3>五專聯合免試</h3>
            <p>想就讀護理、外語、工程等五專科系的主要分發管道，需現場撕榜。</p>
        </div>
        
        <div id="card-art" class="channel-card">
            <h3>藝才班/體育班</h3>
            <p>音樂、美術、舞蹈、戲劇或體育專長，通常需先經過術科測驗。</p>
        </div>
    </div>

    <script>
        // 選取所有的 checkbox
        const toggles = document.querySelectorAll('.channel-toggle');

        // 為每個 checkbox 綁定點擊事件
        toggles.forEach(toggle => {
            toggle.addEventListener('change', function() {
                // 取得這個 checkbox 對應的卡片 ID
                const targetCardId = this.value;
                const targetCard = document.getElementById(targetCardId);

                if (this.checked) {
                    // 有勾選：移除 inactive class，恢復彩色與正常透明度
                    targetCard.classList.remove('inactive');
                } else {
                    // 沒勾選：加入 inactive class，變成灰階與半透明
                    targetCard.classList.add('inactive');
                }
            });
        });
    </script>
</body>
</html>
